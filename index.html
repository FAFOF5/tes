
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة مِعراج | الصرح التشخيصي السيكومتري v14</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen flex flex-col justify-between bg-slate-950 text-slate-100 font-sans selection:bg-emerald-500 selection:text-slate-950">

    <!-- TOP NAVBAR -->
    <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-600 to-amber-500 flex items-center justify-center text-slate-950 font-black text-xl">مـ</div>
                <div>
                    <h1 class="text-lg font-bold text-white font-heading">مِعـراج <span class="text-[10px] px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/30">v14 Modular</span></h1>
                    <p class="text-xs text-slate-400">صرح التشخيص النفسي والذكاء والإدراك المعرفي</p>
                </div>
            </div>

            <nav class="flex items-center gap-2 bg-slate-950 p-1.5 rounded-2xl border border-slate-800 text-xs font-semibold">
                <button data-tab="diagnostics" class="nav-tab px-3 py-2 rounded-xl bg-emerald-600 text-slate-950 font-bold"><i class="fa-solid fa-brain ml-1"></i> المحرك التشخيصي</button>
                <button data-tab="blueprint" class="nav-tab px-3 py-2 rounded-xl text-slate-300 hover:text-white"><i class="fa-solid fa-file-contract text-amber-400 ml-1"></i> المخطط الممتد</button>
                <button data-tab="ai" class="nav-tab px-3 py-2 rounded-xl text-slate-300 hover:text-white"><i class="fa-solid fa-wand-magic-sparkles text-cyan-400 ml-1"></i> مرشد البصيرة</button>
                <button data-tab="workspace" class="nav-tab px-3 py-2 rounded-xl text-slate-300 hover:text-white"><i class="fa-solid fa-stopwatch text-violet-400 ml-1"></i> المؤقت والمختبر</button>
            </nav>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full space-y-8">
        <section id="tab-diagnostics" class="tab-content space-y-6">
            <div id="testsCardGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
        </section>

        <section id="tab-blueprint" class="tab-content hidden space-y-6">
            <div class="bg-slate-900/90 p-6 rounded-3xl border border-slate-800 space-y-6">
                <h2 class="text-2xl font-bold font-heading text-amber-400">مخطط البصيرة الشخصية الممتد</h2>
                <div class="h-64"><canvas id="radarLearningChart"></canvas></div>
                <div id="blueprintOceanText" class="text-xs space-y-2"></div>
                <div id="blueprintIqText" class="text-xs space-y-2"></div>
                <div id="blueprintHbdiText" class="text-xs space-y-2"></div>
                <div id="blueprintStrengthsText" class="text-xs space-y-2"></div>
                <div id="blueprintFixesText" class="text-xs space-y-2"></div>
                <div id="blueprintStudyStrategyText" class="text-xs space-y-2"></div>
            </div>
        </section>

        <section id="tab-ai" class="tab-content hidden space-y-4">
            <div id="aiChatWindow" class="h-[400px] overflow-y-auto p-4 bg-slate-950 rounded-2xl border border-slate-800 space-y-3"></div>
            <form id="aiChatForm" class="flex gap-2">
                <input type="text" id="aiChatInput" required placeholder="اسأل مرشدك المعرفي..." class="flex-grow bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white">
                <button type="submit" class="px-6 py-3 bg-emerald-600 text-slate-950 font-bold rounded-xl text-xs">إرسال</button>
            </form>
        </section>

        <section id="tab-workspace" class="tab-content hidden space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 text-center space-y-4">
                    <span id="timerDisplay" class="text-4xl font-mono font-black text-white">45:00</span>
                    <div class="flex justify-center gap-3">
                        <button id="timerStartBtn" class="px-6 py-3 bg-emerald-600 text-slate-950 font-bold rounded-xl text-xs">بدء الجلسة</button>
                        <button id="brownNoiseBtn" class="px-4 py-3 bg-slate-800 text-amber-400 font-bold rounded-xl text-xs"><span id="brownNoiseText">تشغيل ضوضاء التركيز</span></button>
                    </div>
                </div>

                <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 space-y-4">
                    <button id="dictationBtn" class="px-4 py-2 bg-slate-800 text-emerald-400 font-bold rounded-xl text-xs"><span id="micStatusText">تحدث بالمايك (إملاء مستمر)</span></button>
                    <textarea id="workspaceNotesTextarea" rows="6" placeholder="ملاحظاتك..." class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-white"></textarea>
                </div>
            </div>
        </section>
    </main>

    <!-- TOAST -->
    <div id="toastNotification" class="fixed bottom-6 left-6 bg-slate-900 border border-emerald-500/40 px-5 py-3 rounded-2xl text-xs text-white transform translate-y-20 opacity-0 transition-all duration-300">
        <span id="toastMessage">تم بنجاح</span>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
